# 9host — Cloudflare for SaaS fallback origin Worker (T-07).
# Deploy manually (see docs/UNATTENDED_ORCHESTRATION.md §5): `npx wrangler deploy`
name = "9host-custom-domain-proxy"
main = "custom-domain-proxy.js"
compatibility_date = "2026-01-01"
workers_dev = false

# echonin9.com is the Cloudflare for SaaS zone (Free plan). proxy.echonin9.com is the
# Custom Hostnames fallback origin (AAAA 100::, proxied). "*/*" catches every custom
# hostname routed to this zone. echonin9.com / www.echonin9.com are sent to GitHub by a
# Redirect Rule, which runs before Workers.
routes = [
  { pattern = "proxy.echonin9.com/*", zone_name = "echonin9.com" },
  { pattern = "*/*", zone_name = "echonin9.com" },
]

[vars]
SITES_ORIGIN_HOST = "sites-origin.echo9.net"
