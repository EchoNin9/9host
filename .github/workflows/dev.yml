# Deploy to Staging on push to develop
name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '.cursor/**'
      - '.cursorrules'

permissions:
  id-token: write
  contents: read

concurrency: 9host-tofu-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python (Lambda runtime)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # T-16: test gate - any failure stops the job before tofu init/apply
      - name: Test API (pytest)
        working-directory: api
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend (vitest)
        run: npm --prefix frontend test -- --run

      - name: Typecheck & build frontend
        run: npm --prefix frontend run build

      - name: Test edge functions (node)
        run: node --test infra/tests/*.test.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Build Lambda package
        run: scripts/build-lambda-package.sh

      - name: Install boto3 for data scripts
        run: python -m pip install --quiet boto3

      - name: OpenTofu init (remote state)
        working-directory: infra
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          tofu init -reconfigure -backend-config="bucket=9host-tofu-state-${ACCOUNT_ID}" -backend-config="key=9host/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" -backend-config="dynamodb_table=9host-tofu-state-lock"

      - name: Get API URL
        id: api-url
        working-directory: infra
        run: |
          URL=$(tofu output -raw api_gateway_invoke_url 2>/dev/null || echo "")
          echo "url=${URL:-${{ vars.VITE_API_URL }}}" >> $GITHUB_OUTPUT

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ vars.VITE_COGNITO_REGION || 'us-east-1' }}
          VITE_API_URL: ${{ steps.api-url.outputs.url }}

      # Apply deploy policy first so CI has new permissions (CreateRole, EventBridge, etc.) before plan/apply
      # -refresh=false avoids reading EventBridge/other resources before we have ListTagsForResource
      - name: OpenTofu apply (deploy policy)
        working-directory: infra
        run: tofu apply -auto-approve -no-color -refresh=false -target=aws_iam_policy.deploy -var="github_org_repo=${{ github.repository }}" -var='domains=["echo9.net"]'

      - name: Wait for IAM propagation
        run: sleep 45

      - name: OpenTofu plan
        working-directory: infra
        run: tofu plan -no-color -var="github_org_repo=${{ github.repository }}" -var='domains=["echo9.net"]'

      - name: OpenTofu apply
        working-directory: infra
        run: tofu apply -auto-approve -no-color -var="github_org_repo=${{ github.repository }}" -var='domains=["echo9.net"]'

      - name: Seed platform templates
        run: |
          TABLE=$(cd infra && tofu output -raw dynamodb_table_name)
          python scripts/seed_templates.py --table "$TABLE"

      - name: Backfill gsi4 on existing sites (Task 1.76)
        run: |
          TABLE=$(cd infra && tofu output -raw dynamodb_table_name)
          python scripts/backfill_gsi4_sites.py --table "$TABLE"

      - name: Backfill byEntity keys on tenants and domains (T-17)
        run: |
          TABLE=$(cd infra && tofu output -raw dynamodb_table_name)
          python scripts/backfill_by_entity.py --table "$TABLE"

      - name: Sync frontend to S3 (staging)
        run: |
          aws s3 sync frontend/dist/ s3://9host-frontend-staging/ --delete
          aws s3 cp s3://9host-frontend-staging/index.html s3://9host-frontend-staging/index.html --metadata-directive REPLACE --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache (staging + sites)
        run: |
          DIST_STAGING=$(cd infra && tofu output -raw cloudfront_staging_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_STAGING" --paths "/*"
          DIST_SITES=$(cd infra && tofu output -raw cloudfront_sites_distribution_id 2>/dev/null || true)
          if [ -n "$DIST_SITES" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_SITES" --paths "/*"
          fi

      # Runbook task F: standalone landing site (9host-landing, not a tenant site / no KVS)
      - name: Sync landing site to S3 + invalidate
        run: |
          LANDING_BUCKET=$(cd infra && tofu output -raw s3_landing_bucket)
          LANDING_DIST=$(cd infra && tofu output -raw cloudfront_landing_distribution_id)
          aws s3 sync landing/ "s3://${LANDING_BUCKET}/" --delete
          aws cloudfront create-invalidation --distribution-id "$LANDING_DIST" --paths "/*"
